<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#2a160a"/>
      <stop offset="70%" stop-color="#120a06"/>
      <stop offset="100%" stop-color="#080402"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff0aa"/>
      <stop offset="35%" stop-color="#d4af37"/>
      <stop offset="70%" stop-color="#aa7c11"/>
      <stop offset="100%" stop-color="#e6c24f"/>
    </linearGradient>
    <linearGradient id="copperGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff9e00"/>
      <stop offset="50%" stop-color="#b85d19"/>
      <stop offset="100%" stop-color="#7a3407"/>
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00ffff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0088cc" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="105" fill="url(#bgGrad)"/>

  <!-- Outer Art Deco Riveted Border -->
  <rect x="20" y="20" width="472" height="472" rx="90" fill="none" stroke="url(#goldGrad)" stroke-width="8"/>
  <rect x="36" y="36" width="440" height="440" rx="76" fill="none" stroke="url(#copperGrad)" stroke-width="3" stroke-dasharray="8 6"/>

  <!-- Sunburst Rays Behind Mic -->
  <g opacity="0.35" stroke="url(#goldGrad)" stroke-width="2">
    <line x1="256" y1="230" x2="100" y2="70"/>
    <line x1="256" y1="230" x2="160" y2="50"/>
    <line x1="256" y1="230" x2="256" y2="40"/>
    <line x1="256" y1="230" x2="352" y2="50"/>
    <line x1="256" y1="230" x2="412" y2="70"/>
    <line x1="256" y1="230" x2="450" y2="130"/>
    <line x1="256" y1="230" x2="470" y2="210"/>
    <line x1="256" y1="230" x2="42" y2="210"/>
    <line x1="256" y1="230" x2="62" y2="130"/>
  </g>

  <!-- Steampunk Clockwork Gear -->
  <g transform="translate(256, 230)" filter="url(#goldGlow)">
    <circle r="140" fill="none" stroke="url(#copperGrad)" stroke-width="14"/>
    <circle r="128" fill="none" stroke="url(#goldGrad)" stroke-width="4"/>
    <!-- Gear Cogs -->
    <g fill="url(#goldGrad)">
      <rect x="-10" y="-154" width="20" height="24" rx="4"/>
      <rect x="-10" y="130" width="20" height="24" rx="4"/>
      <rect x="-154" y="-10" width="24" height="20" rx="4"/>
      <rect x="130" y="-10" width="24" height="20" rx="4"/>
      <rect x="90" y="90" width="20" height="24" rx="4" transform="rotate(45, 100, 102)"/>
      <rect x="-110" y="-110" width="20" height="24" rx="4" transform="rotate(45, -100, -98)"/>
      <rect x="90" y="-110" width="20" height="24" rx="4" transform="rotate(-45, 100, -98)"/>
      <rect x="-110" y="90" width="20" height="24" rx="4" transform="rotate(-45, -100, 102)"/>
    </g>
  </g>

  <!-- Acoustic Radio Sound Waves -->
  <g stroke="#00ffff" stroke-width="4" fill="none" opacity="0.8">
    <path d="M 120 180 A 150 150 0 0 0 120 280" stroke-linecap="round"/>
    <path d="M 90 150 A 190 190 0 0 0 90 310" stroke-linecap="round" opacity="0.5"/>
    <path d="M 392 180 A 150 150 0 0 1 392 280" stroke-linecap="round"/>
    <path d="M 422 150 A 190 190 0 0 1 422 310" stroke-linecap="round" opacity="0.5"/>
  </g>

  <!-- 1920s Spring Ring Radio Announcer Microphone -->
  <g transform="translate(256, 230)">
    <!-- Outer Ring -->
    <circle r="72" fill="none" stroke="url(#goldGrad)" stroke-width="12"/>
    <!-- Suspension Springs -->
    <line x1="0" y1="-72" x2="0" y2="-45" stroke="url(#copperGrad)" stroke-width="4"/>
    <line x1="0" y1="72" x2="0" y2="45" stroke="url(#copperGrad)" stroke-width="4"/>
    <line x1="-72" y1="0" x2="-45" y2="0" stroke="url(#copperGrad)" stroke-width="4"/>
    <line x1="72" y1="0" x2="45" y2="0" stroke="url(#copperGrad)" stroke-width="4"/>

    <!-- Central Mic Capsule -->
    <rect x="-38" y="-45" width="76" height="90" rx="38" fill="#1e140e" stroke="url(#goldGrad)" stroke-width="5"/>
    <!-- Grille Slots -->
    <line x1="-24" y1="-20" x2="24" y2="-20" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round"/>
    <line x1="-28" y1="-5" x2="28" y2="-5" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round"/>
    <line x1="-28" y1="10" x2="28" y2="10" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round"/>
    <line x1="-24" y1="25" x2="24" y2="25" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round"/>

    <!-- Stand Neck & Base -->
    <rect x="-10" y="72" width="20" height="90" fill="url(#goldGrad)"/>
    <path d="M -50 162 L 50 162 L 70 185 L -70 185 Z" fill="url(#copperGrad)"/>
    <rect x="-60" y="185" width="120" height="12" rx="4" fill="url(#goldGrad)"/>
  </g>

  <!-- Art Deco Rivet Corner Accents -->
  <circle cx="50" cy="50" r="8" fill="url(#goldGrad)"/>
  <circle cx="462" cy="50" r="8" fill="url(#goldGrad)"/>
  <circle cx="50" cy="462" r="8" fill="url(#goldGrad)"/>
  <circle cx="462" cy="462" r="8" fill="url(#goldGrad)"/>
</svg>
